<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2c44"><meta name="description" content="IA na Prática Parte 2 — Fronteira Agêntica: agentes, Cowork, Codex, Manus, harness, loops, graph engineering, vibe coding, modelos chineses e vídeo generativo."><title>IA na Prática · Parte 2 — Fronteira Agêntica</title><style>:root{--n:#0f2c44;--t:#17877f;--g:#bd8428;--ink:#152431;--mut:#6f7f89;--bg:#071019}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#071019,#112c3c);color:#fff;overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr 62px}.top{display:flex;align-items:center;gap:8px;padding:0 12px;background:#06131ddd;border-bottom:1px solid #ffffff18;backdrop-filter:blur(12px);z-index:30}.brand{margin-right:auto;min-width:0}.brand b{display:block;font-size:14px}.brand span{display:block;font-size:10px;color:#9fb2bf}.btn{border:1px solid #ffffff1f;background:#ffffff0d;color:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.btn:hover{background:#ffffff18}.zoom{display:flex;align-items:center}.zoom .btn{border-radius:0}.zoom .btn:first-child{border-radius:10px 0 0 10px}.zoom .btn:last-child{border-radius:0 10px 10px 0}.stage{position:relative;display:grid;place-items:center;min-height:0;padding:18px 68px;perspective:1800px;overflow:auto}.book{width:min(1040px,88vw);height:min(74vh,700px);display:grid;grid-template-columns:1fr 1fr;transform-origin:center;transition:transform .2s}.page{position:relative;background:#fff;color:var(--ink);padding:clamp(22px,3vw,46px);overflow:auto;box-shadow:0 24px 48px #0007}.page.left{border-radius:10px 0 0 10px;border-right:1px solid #d8d5ce}.page.right{border-radius:0 10px 10px 0}.page:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 88%,#0000000c)}.page.right:before{background:linear-gradient(90deg,#0000000c,transparent 12%)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--t);text-transform:uppercase}.page h1{font-size:clamp(27px,3.4vw,47px);line-height:1.02;margin:12px 0 16px;color:var(--n)}.page h2{font-size:clamp(20px,2.2vw,31px);line-height:1.1;margin:10px 0 15px;color:var(--n)}.page p{font-size:clamp(13px,1.15vw,17px);line-height:1.55}.page ul{padding-left:20px}.page li{margin:8px 0;font-size:clamp(13px,1.08vw,16px);line-height:1.4}.call{margin-top:18px;padding:14px 16px;border-left:4px solid var(--g);background:#f4f0e8;border-radius:0 9px 9px 0;font-size:14px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#e7f3f1;color:#11665f;font-weight:700}.num{position:absolute;right:20px;bottom:14px;color:#829099;font-size:11px}.cover{background:linear-gradient(145deg,#0f2c44,#17475d);color:#fff}.cover h1,.cover h2{color:#fff}.cover .eyebrow{color:#d9a343}.cover .call{background:#ffffff12;color:#fff;border-color:#d9a343}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:14px;background:#06131dbb;border:1px solid #ffffff21;color:#fff;font-size:25px;cursor:pointer;z-index:20}.arrow:hover{background:#17877f77}.arrow.prev{left:10px}.arrow.next{right:10px}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 14px;background:#06131ddd;border-top:1px solid #ffffff16}.progress{height:5px;background:#ffffff20;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--t));width:0}.pager{display:flex;align-items:center;gap:7px;font-size:12px}.pager input{width:48px;text-align:center;background:#ffffff0d;border:1px solid #ffffff20;color:#fff;border-radius:8px;padding:7px}.hint{text-align:right;color:#8ea2ae;font-size:11px}.drawer,.hub{position:absolute;top:58px;bottom:62px;width:min(430px,94vw);background:#071923f8;z-index:45;box-shadow:0 0 45px #0006;transition:.28s;overflow:auto}.drawer{left:0;transform:translateX(-104%);border-right:1px solid #ffffff1c}.hub{right:0;transform:translateX(104%);border-left:1px solid #ffffff1c}.drawer.open,.hub.open{transform:none}.panelhead{position:sticky;top:0;background:#071923f5;padding:16px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;gap:8px;z-index:2}.panelhead b{margin-right:auto}.search{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #ffffff1a;background:#ffffff0c;color:#fff;margin:0 0 12px}.inside{padding:14px}.tocitem{padding:10px;border-radius:9px;cursor:pointer;color:#d7e1e6;font-size:13px}.tocitem:hover,.tocitem.on{background:#17877f30}.card{padding:12px;border:1px solid #ffffff18;background:#ffffff08;border-radius:10px;margin:9px 0}.card b{display:block;margin-bottom:5px}.card p{font-size:12px;color:#b9c9d1;line-height:1.4;margin:5px 0}.card a{color:#64d6cb;font-size:12px}.copy{margin-top:7px;border:0;border-radius:7px;background:var(--t);color:#fff;padding:7px 9px;cursor:pointer}.tabs{display:flex;gap:6px;padding:0 14px 12px}.tabs button{flex:1}.overlay{position:absolute;inset:58px 0 62px;background:#0007;z-index:40;display:none}.overlay.show{display:block}.flipNext{animation:fn .5s ease}.flipPrev{animation:fp .5s ease}@keyframes fn{0%{transform:rotateY(0)}45%{transform:rotateY(-12deg) scale(.985)}100%{transform:rotateY(0)}}@keyframes fp{0%{transform:rotateY(0)}45%{transform:rotateY(12deg) scale(.985)}100%{transform:rotateY(0)}}@media(max-width:820px){.top{height:54px}.app{grid-template-rows:54px 1fr 58px}.brand span{display:none}.btn .lab{display:none}.stage{padding:10px}.book{width:min(94vw,610px);height:calc(100% - 4px);display:block}.page{height:100%;border-radius:9px!important;padding:26px 25px}.page.right{display:none}.arrow{display:none}.bottom{grid-template-columns:1fr auto}.hint{display:none}.drawer,.hub{top:54px;bottom:58px}.overlay{inset:54px 0 58px}.page h1{font-size:34px}.page h2{font-size:25px}}@media(max-width:440px){.top{gap:5px;padding:0 7px}.btn{padding:8px}.brand b{font-size:12px}.page{padding:24px 20px}.page p,.page li{font-size:14px}.zoom .btn:nth-child(2){min-width:48px}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>IA NA PRÁTICA · PARTE 2</b><span>Fronteira Agêntica · avançado sem ser dev</span></div><button class="btn" id="tocBtn">☰ <span class="lab">Índice</span></button><button class="btn" id="hubBtn">⌘ <span class="lab">Recursos</span></button><div class="zoom"><button class="btn" id="zm">−</button><button class="btn" id="zr">100%</button><button class="btn" id="zp">+</button></div><button class="btn" id="fs">⛶</button></header><main class="stage" id="stage"><button class="arrow prev" id="prev">‹</button><div class="book" id="book"><article class="page left" id="p1"></article><article class="page right" id="p2"></article></div><button class="arrow next" id="next">›</button></main><footer class="bottom"><div class="progress"><i id="bar"></i></div><div class="pager"><span>Página</span><input id="go" inputmode="numeric"><span id="total"></span></div><div class="hint">← → navegar · Ctrl/Cmd ± zoom · F tela cheia</div></footer><div class="overlay" id="ov"></div><aside class="drawer" id="drawer"><div class="panelhead"><b>Índice & busca</b><button class="btn" id="dx">×</button></div><div class="inside"><input class="search" id="search" placeholder="Buscar tema, termo ou ferramenta…"><div id="toc"></div></div></aside><aside class="hub" id="hub"><div class="panelhead"><b>Central de recursos</b><button class="btn" id="hx">×</button></div><div class="tabs"><button class="btn" data-tab="res">Ferramentas</button><button class="btn" data-tab="prompts">Prompts</button><button class="btn" data-tab="gloss">Glossário</button></div><div class="inside" id="hubbody"></div></aside></div><script>const P=[
{t:'Parte 2 · Fronteira Agêntica',e:'Do copiloto ao sistema que executa',c:'cover',p:['Cowork · Codex · Manus · Harness · Loops · Graph Engineering · Vibe Coding · DeepSeek · Qwen · Kimi · Seedance · HeyGen · CapCut'],q:'Para profissionais que já usam IA e querem delegar trabalho, desenhar fluxos, criar protótipos e operar agentes com segurança.'},
{t:'Para quem é esta Parte 2',e:'Antes de começar',p:['Você já sabe conversar com IA. Agora o salto é aprender a orquestrar trabalho: contexto, ferramentas, critérios, iteração e aprovação humana.'],b:['Você não precisa virar dev: pense como dono do processo e product owner do agente.','Autonomia não é “liberar geral”: aumente autonomia junto com limites, logs, verificação e gates.','O diferencial deixa de ser um prompt isolado e passa a ser o desenho do sistema.'],q:'Pergunte sempre: o que quero que aconteça? Como saberei que terminou corretamente?'},
{t:'A nova fronteira em uma página',e:'Mapa mental',b:['Prompt — instrui uma interação.','Context — escolhe o dossiê que entra no raciocínio.','Skill — empacota um jeito repetível de trabalhar.','Harness — cria o ambiente operacional do agente.','Loop — organiza agir → observar → verificar → corrigir → parar.','Graph — conecta múltiplos agentes e subtarefas.'],q:'Gestão: prompt é briefing; contexto é dossiê; skill é SOP; harness é ambiente; loop é rotina; graph é organograma + processo.'},
{t:'Glossário de fronteira I',e:'Novos termos',b:['Agent: IA que usa ferramentas e persegue um objetivo por vários passos.','Tool use: capacidade de pesquisar, editar arquivos, rodar código ou acessar apps.','MCP: padrão para conectar modelos a ferramentas e dados.','Skill: pacote reutilizável de instruções, exemplos e recursos.','Memory/State: o que persiste entre passos ou sessões.','Sandbox: ambiente isolado para execução controlada.','RAG: busca de fontes externas antes da resposta.']},
{t:'Glossário de fronteira II',e:'Novos termos',b:['Harness Engineering: desenho do ambiente que cerca o modelo.','Loop Engineering: desenho da repetição autônoma e da condição de parada.','Graph Engineering: desenho de nós, dependências, roteamento e handoffs.','Human-in-the-loop: ponto de revisão ou aprovação humana.','Stop condition: regra objetiva de encerramento.','Eval: teste que mede qualidade.','Prompt injection: conteúdo externo que tenta desviar o agente de suas regras.']},
{t:'Modelo ≠ produto ≠ agente',e:'Arquitetura mental',b:['Modelo: motor de inteligência — GPT, Claude, DeepSeek, Qwen, Kimi.','Produto: interface e experiência — ChatGPT, Claude, apps especializados.','Agente: sistema que combina modelo + ferramentas + estado + regras + execução.'],q:'Compare ferramentas pela tarefa completa, não só pelo “QI” do modelo.'},
{t:'Context Engineering',e:'A qualidade começa antes do prompt',p:['Context engineering é decidir quais informações entram, quando entram, em que formato e por quanto tempo permanecem disponíveis.'],b:['Inclua objetivo, contexto do negócio, dados, exemplos e restrições.','Separe fatos estáveis de informações que precisam ser atualizadas.','Evite contexto infinito: excesso também degrada decisão.','Dê ao agente uma hierarquia explícita de fontes.'],q:'Dica: monte um “context pack” de uma página antes de delegar uma missão importante.'},
{t:'Skills, MCP e conectores',e:'Capacidade reutilizável',b:['Skill: como fazemos esta tarefa.','MCP: como o agente conversa com ferramentas e fontes.','Connector/plugin: permissão prática para acessar um sistema específico.','Tool: ação que o agente pode executar.'],q:'Pense em skills como treinamento; MCP/conectores como portas; tools como mãos.'},
{t:'Agentes e autonomia',e:'Delegar sem perder controle',b:['Nível 0: responde.','Nível 1: sugere ações.','Nível 2: executa dentro de um sandbox.','Nível 3: usa ferramentas com gates.','Nível 4: executa rotinas recorrentes com monitoramento.'],q:'A autonomia deve crescer somente quando qualidade, observabilidade e rollback também crescem.'},
{t:'Como escrever uma missão agêntica',e:'Briefing executivo',b:['Resultado: o que deve existir no final.','Escopo: o que entra e o que não entra.','Fontes: onde buscar verdade.','Ferramentas: o que pode usar.','Critérios: o que significa “bom”.','Gates: o que exige aprovação.','Stop: quando parar.'],q:'Troque “faça uma análise” por uma missão com definição de pronto.'},
{t:'Claude Cowork',e:'Agente para trabalho de conhecimento',p:['Cowork leva capacidades agênticas do ecossistema Claude para tarefas de conhecimento sem exigir terminal. O foco é delegar uma entrega, não apenas conversar.'],b:['Brilha em documentos, arquivos, pesquisa, síntese, planilhas e tarefas extensas.','Útil quando o verbo é organize, consolide, prepare, compare, atualize.','Dê pasta/escopo claro e limite o que pode ser alterado.'],q:'Chat para pensar junto; Cowork quando você quer “faça e entregue”.'},
{t:'Cowork na prática',e:'Workflow recomendado',b:['1. Crie uma pasta de trabalho com fontes confiáveis.','2. Escreva resultado e critérios de pronto.','3. Peça plano antes da execução.','4. Aprove ações que alterem dados importantes.','5. Exija resumo de mudanças e pendências.'],q:'Use para transformar um conjunto caótico de arquivos em um briefing, review ou operating pack.'},
{t:'OpenAI Codex',e:'Agente de construção',p:['Codex é orientado a construir, modificar, testar e revisar software, mas para o não-dev o valor está em atuar como product owner: descrever comportamento, critérios e testes.'],b:['Pode decompor trabalho, editar arquivos e testar resultados.','Skills tornam processos de equipe reutilizáveis.','Multiagente permite tarefas paralelas em ambientes separados.','Bom para ferramentas internas, automações, protótipos e sites.'],q:'Você não precisa saber escrever o código; precisa saber definir o produto e julgar o resultado.'},
{t:'Codex sem virar dev',e:'Product owner do agente',b:['Especifique usuário e problema.','Descreva fluxo feliz e exceções.','Defina dados de entrada e saída.','Peça testes antes de considerar concluído.','Solicite README e instruções de rollback.','Nunca aceite “funcionou aqui” como critério de produção.']},
{t:'Manus',e:'Agente generalista de execução',p:['Manus é útil quando a missão atravessa pesquisa + análise + criação de artefatos e você quer um generalista conduzindo vários passos.'],b:['Use Agent Mode para entregas multietapas.','Excelente para pesquisas transformadas em sites, apresentações ou arquivos.','Defina fontes e checkpoints para evitar que velocidade substitua verificação.'],q:'Pense em Manus quando o trabalho inteiro importa mais que uma única resposta.'},
{t:'Manus na prática',e:'Missões completas',b:['Market scan → análise → recomendação → apresentação.','Pesquisa de concorrentes → matriz → landing page.','Dossiê de evento → agenda → briefing executivo.','Benchmark → hipóteses → plano de teste.'],q:'Divida grandes missões em marcos observáveis; não espere o fim para descobrir um desvio.'},
{t:'Cowork × Codex × Manus',e:'Como escolher',b:['Cowork: trabalho de conhecimento e arquivos.','Codex: construção, automação e produto digital.','Manus: execução generalista multietapas.'],q:'Escolha pelo tipo de trabalho e pelo ambiente de execução — não pela marca favorita.'},
{t:'Harness Engineering',e:'O ambiente é parte da inteligência',p:['Harness é a camada que transforma o modelo em operador confiável: instruções, ferramentas, permissões, memória, sandbox, logs e políticas.'],b:['Mission: objetivo e prioridades.','Tools: o que consegue fazer.','Permissions: o que está autorizado.','Memory: o que deve lembrar.','Verification: como checa a entrega.','Observability: como você acompanha ações e custos.'],q:'De “confio no modelo” para “confio no sistema porque ele opera em um ambiente desenhado”.'},
{t:'Canvas de Harness',e:'Para não-devs',b:['1. Missão.','2. Fontes de verdade.','3. Skills/SOPs.','4. Ferramentas.','5. Permissões.','6. Memória/estado.','7. Verificação/evals.','8. Escalonamento humano.'],q:'Se você consegue preencher essas oito caixas, já consegue desenhar um agente útil sem programar.'},
{t:'Loop Engineering',e:'Projetar repetição',p:['Loop engineering trata a repetição como sistema: gatilho → agir → observar → verificar → corrigir → decidir se continua.'],b:['Trigger: o que inicia.','State: o que acompanha progresso.','Verifier: como mede qualidade.','Retry: o que muda na próxima tentativa.','Budget: limite de tempo/custo.','Stop: condição de parada.','Escalation: quando chamar humano.']},
{t:'Loops que não viram looping infinito',e:'Controle',b:['Defina máximo de tentativas.','Mude a estratégia após falhas repetidas.','Registre por que cada retry aconteceu.','Pare quando ganho marginal cair.','Escalone conflitos de fonte ou decisão irreversível.'],q:'Um agente bom sabe continuar; um sistema bom também sabe parar.'},
{t:'Graph Engineering',e:'Do agente único à rede',p:['Graph engineering organiza tarefas como nós conectados: alguns executam, outros verificam, outros roteiam ou consolidam.'],b:['Nós: agentes ou subtarefas.','Arestas: dependências e handoffs.','Router: decide o próximo caminho.','Parallel: executa trabalhos independentes simultaneamente.','Judge/verifier: inspeciona qualidade antes do merge.']},
{t:'Um graph de marketing',e:'Exemplo não-dev',b:['Nó 1: pesquisa mercado.','Nó 2: social listening.','Nó 3: dados internos.','Nó 4: sintetizador de insights.','Nó 5: estrategista cria opções.','Nó 6: brand/legal QA.','Nó 7: humano aprova.','Nó 8: produção e distribuição.'],q:'O graph deixa claro onde paralelizar e onde não se pode avançar sem validação.'},
{t:'Vibe Coding',e:'Construir descrevendo intenção',p:['Vibe coding usa linguagem natural para criar software com grande parte do código gerado por IA. Para não-dev, é uma nova interface de prototipação — não um passe livre para ignorar qualidade.'],b:['Comece pelo problema e pelo usuário.','Peça protótipo pequeno.','Teste fluxos e exceções.','Mantenha dados sensíveis fora da demo.','Documente dependências e rollback.'],q:'Vibe coding é ótimo para protótipos; produção exige engenharia de verdade.'},
{t:'Vibe coding em 90 minutos',e:'Experimento seguro',b:['0–15 min: problema + critério de sucesso.','15–30: wireframe e fluxo.','30–60: agente constrói MVP.','60–75: testes com casos reais anonimizados.','75–90: bugs, documentação e próximos passos.'],q:'Projeto ideal: calculadora, dashboard, gerador de briefing ou workflow interno sem dados críticos.'},
{t:'Quando parar de “vibar”',e:'Sinais de maturidade',b:['Mais usuários e dependências.','Autenticação e dados pessoais.','Integração com sistemas críticos.','Pagamentos ou decisões de alto impacto.','Necessidade de SLA, segurança e manutenção.'],q:'O momento de chamar engenharia é um sinal de sucesso do protótipo, não de fracasso.'},
{t:'Modelos chineses: como olhar',e:'Panorama',p:['A China virou um polo central de modelos de linguagem e multimodais. O ponto não é “quem vence”, e sim ampliar opções de custo, contexto, abertura e especialização.'],b:['Compare qualidade na sua tarefa, não benchmark genérico.','Teste idioma português/espanhol e nuance regional.','Revise políticas de dados e implantação.','Faça bake-off com o mesmo dataset e rubrica.']},
{t:'DeepSeek',e:'Modelo chinês',p:['A família DeepSeek ganhou relevância por raciocínio, eficiência e ecossistema aberto/compatível com APIs.'],b:['Bom candidato para experimentos de raciocínio e desenvolvimento.','Avalie versão vigente, limites, hospedagem e política de dados.','Não presuma equivalência entre app público e implantação via API/modelo aberto.'],q:'Teste com 20–50 tarefas reais do seu negócio e compare custo × qualidade × latência.'},
{t:'Qwen',e:'Ecossistema Alibaba',p:['Qwen é uma família ampla com modelos de texto, código e multimodais, frequentemente com opções abertas e comerciais.'],b:['Útil para comparar modelos generalistas e especializados.','Observe tamanhos/variantes: “Qwen” não é um único modelo.','Teste visão e documentos quando o workflow for multimodal.']},
{t:'Kimi K3',e:'Moonshot AI',p:['Kimi K3 representa a corrida por modelos de grande contexto e capacidades agênticas/multimodais.'],b:['Contexto grande é útil para dossiês extensos, mas não substitui context engineering.','Faça testes de recuperação de fatos ao longo de documentos longos.','Compare capacidade de tool use e não apenas respostas de chat.']},
{t:'Model bake-off',e:'Escolha por evidência',b:['Monte 30 tarefas representativas.','Defina rubrica: acurácia, completude, estilo, fontes, tempo e custo.','Rode os mesmos inputs em 3–5 modelos.','Faça avaliação cega quando possível.','Escolha por workload — pode haver mais de um vencedor.'],q:'Modelo “melhor” é uma pergunta incompleta. Melhor para quê, com quais restrições e a que custo?'},
{t:'Vídeo generativo avançado',e:'Do prompt ao pipeline',p:['Vídeo com IA já funciona melhor como pipeline do que como botão mágico: conceito → storyboard → geração → avatar/voz → montagem → QA.'],b:['Defina continuidade visual.','Use imagens/referências consistentes.','Planeje cenas curtas e editáveis.','Separe geração, fala e finalização.','Revise direitos, identidade e claims.']},
{t:'Seedance',e:'Geração de vídeo',b:['Use para criar cenas e movimentos a partir de texto/imagem e referências.','Escreva prompt por plano: sujeito, ação, ambiente, câmera, luz, duração e continuidade.','Gere variações curtas e monte depois.'],q:'Não tente resolver um filme inteiro em uma geração; pense como diretor e editor.'},
{t:'HeyGen',e:'Avatares e localização',b:['Bom para presenter videos, digital twins, dublagem e versões multilíngues.','Crie roteiro com frases naturais para fala.','Teste pronúncia de nomes e termos técnicos.','Mantenha transparência quando houver avatar sintético.'],q:'Combine avatar consistente com b-roll gerado para evitar vídeo visualmente monótono.'},
{t:'CapCut',e:'Montagem e escala',b:['Use como camada de edição: cortes, legendas, trilha, formatos, templates e versões.','Crie master 16:9 e derivados 9:16/1:1.','Padronize brand kit e safe zones.','Faça QA de legenda e timing antes de publicar.']},
{t:'Stack Seedance → HeyGen → CapCut',e:'Pipeline prático',b:['1. Seedance: cenas/b-roll.','2. HeyGen: apresentador, voz ou localização.','3. CapCut: montagem, legendas, música, CTA e formatos.','4. Humano: brand, factual, legal e qualidade.'],q:'O ganho vem da especialização: cada ferramenta faz uma parte do trabalho.'},
{t:'Agentes para market intelligence',e:'Workflow',b:['Coletor: busca fontes autorizadas.','Extrator: estrutura fatos.','Analista: encontra padrões.','Cético: procura evidência contrária.','Sintetizador: cria implicações.','Humano: decide.'],q:'Exija fonte ao lado de cada fato; opinião sem evidência deve ser rotulada como hipótese.'},
{t:'Agentes para Campaign QA',e:'Workflow',b:['Nó de brand voice.','Nó factual/claims.','Nó de acessibilidade.','Nó de tradução/localização.','Nó de plataforma/formatos.','Consolidador com severidade e correção sugerida.'],q:'QA multiagente é ótimo quando cada verificador tem uma rubrica estreita e explícita.'},
{t:'Guardrails e evals',e:'Autonomia com segurança',b:['Least privilege: dê o mínimo de acesso necessário.','Allowlist de fontes e ações.','Gates antes de apagar, enviar ou publicar.','Evals com dataset real.','Logs e rastreabilidade.','Budget de custo/tempo.','Rollback para mudanças.'],q:'A pergunta não é “o agente pode?”. É “em que condições ele deve poder?”.'},

nte','Analise a execução de [MISSÃO]. Compare plano versus resultado, identifique onde contexto, tools, permissões, verificação ou stop conditions falharam e proponha alterações no harness. Separe bug pontual de problema de sistema.']];let z=1,idx=0,anim=false;const $=x=>document.getElementById(x),mobile=()=>innerWidth<=820,esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function html(p,n){if(!p)return'';return `<div class="eyebrow">${esc(p.e||'IA na Prática')}</div><h${n===0?1:2}>${esc(p.t)}</h${n===0?1:2}>${p.p?(p.p.map(x=>`<p>${esc(x)}</p>`).join('')):''}${p.b?`<ul>${p.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${p.q?`<div class="call">${esc(p.q)}</div>`:''}<span class="num">${String(n+1).padStart(2,'0')} / ${P.length}</span>`}function render(){let a=mobile()?idx:Math.floor(idx/2)*2,b=a+1;$('p1').className='page left '+(P[a]?.c||'');$('p1').innerHTML=html(P[a],a);$('p2').className='page right '+(P[b]?.c||'');$('p2').innerHTML=html(P[b],b);$('p2').style.visibility=b<P.length?'visible':'hidden';$('go').value=idx+1;$('total').textContent='/ '+P.length;$('bar').style.width=((idx+1)/P.length*100)+'%';document.querySelectorAll('.tocitem').forEach((e,i)=>e.classList.toggle('on',i===idx));}function jump(n,dir=1){n=Math.max(0,Math.min(P.length-1,n));if(n===idx)return;idx=n;let b=$('book');b.classList.remove('flipNext','flipPrev');void b.offsetWidth;b.classList.add(dir>0?'flipNext':'flipPrev');render()}$('next').onclick=()=>jump(idx+(mobile()?1:2),1);$('prev').onclick=()=>jump(idx-(mobile()?1:2),-1);$('go').onchange=e=>jump((+e.target.value||1)-1,+e.target.value>idx+1?1:-1);function setz(v){z=Math.max(.75,Math.min(2.5,v));$('book').style.transform=`scale(${z})`;$('zr').textContent=Math.round(z*100)+'%'}$('zp').onclick=()=>setz(z+.25);$('zm').onclick=()=>setz(z-.25);$('zr').onclick=()=>setz(1);$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();function close(){ $('drawer').classList.remove('open');$('hub').classList.remove('open');$('ov').classList.remove('show')}$('tocBtn').onclick=()=>{$('drawer').classList.add('open');$('ov').classList.add('show')};$('hubBtn').onclick=()=>{showHub('res');$('hub').classList.add('open');$('ov').classList.add('show')};$('dx').onclick=$('hx').onclick=$('ov').onclick=close;function makeToc(q=''){let s=q.toLowerCase();$('toc').innerHTML=P.map((p,i)=>({p,i})).filter(x=>!s||(x.p.t+' '+x.p.e+' '+(x.p.p||[]).join(' ')+(x.p.b||[]).join(' ')).toLowerCase().includes(s)).map(x=>`<div class="tocitem ${x.i===idx?'on':''}" data-i="${x.i}">${String(x.i+1).padStart(2,'0')} · ${esc(x.p.t)}</div>`).join('');document.querySelectorAll('.tocitem').forEach(e=>e.onclick=()=>{jump(+e.dataset.i,+e.dataset.i>idx?1:-1);close()})}$('search').oninput=e=>makeToc(e.target.value);function showHub(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.style.background=x.dataset.tab===tab?'#17877f55':'');if(tab==='res')$('hubbody').innerHTML=R.map(r=>`<div class="card"><b>${r[0]}</b><p>${r[2]}</p><a href="${r[1]}" target="_blank" rel="noopener">Abrir ferramenta ↗</a><br><img loading="lazy" alt="QR" style="width:82px;margin-top:8px;background:#fff;padding:4px;border-radius:6px" src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(r[1])}"></div>`).join('');if(tab==='prompts')$('hubbody').innerHTML=PR.map((r,i)=>`<div class="card"><b>${r[0]}</b><p>${esc(r[1])}</p><button class="copy" data-p="${i}">Copiar prompt</button></div>`).join('');if(tab==='gloss')$('hubbody').innerHTML=G.map(r=>`<div class="card"><b>${r[0]}</b><p>${r[1]}</p></div>`).join('');document.querySelectorAll('.copy').forEach(e=>e.onclick=async()=>{await navigator.clipboard.writeText(PR[+e.dataset.p][1]);e.textContent='Copiado ✓';setTimeout(()=>e.textContent='Copiar prompt',1200)})}document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>showHub(e.dataset.tab));addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDow
